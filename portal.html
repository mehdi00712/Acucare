<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AcuCare Clinical Portal</title><link rel="stylesheet" href="assets/css/admin.css"></head><body><aside><a class="admin-logo" href="portal.html"><span>A+</span><div><strong>AcuCare</strong><small id="roleLabel">Clinical Portal</small></div></a><nav><button class="nav-btn active" data-view="appointments">Appointments</button><button class="nav-btn" data-view="patients">Patients</button><button class="nav-btn admin-only" data-view="staff">Staff & doctors</button><a href="index.html">Public website</a><button id="logoutBtn">Logout</button></nav></aside><main><header><div><p id="welcome">AcuCare</p><h1 id="pageTitle">Appointments</h1></div><div class="header-tools"><select id="language"><option value="en">English</option><option value="fr">Français</option><option value="zh">中文</option></select><button id="newPatientBtn">+ New patient</button></div></header><section class="stats"><article><small>Today</small><strong id="todayCount">0</strong></article><article><small>Pending</small><strong id="pendingCount">0</strong></article><article><small>Patients</small><strong id="patientCount">0</strong></article><article><small>Clinic</small><strong id="clinicName">—</strong></article></section><section class="panel" id="appointmentsView"><div class="toolbar"><input id="appointmentSearch" placeholder="Search patient, phone or reference"><select id="branchFilter"><option value="">All clinics</option><option>Ebène</option><option>Port Louis</option></select><select id="statusFilter"><option value="">All statuses</option><option>Pending confirmation</option><option>Confirmed</option><option>Checked in</option><option>Completed</option><option>No-show</option><option>Cancelled</option></select></div><div class="table-wrap"><table><thead><tr><th>Patient</th><th>Clinic</th><th>Doctor</th><th>Date & time</th><th>Treatment</th><th>Status</th></tr></thead><tbody id="appointmentRows"></tbody></table></div></section><section class="panel hidden" id="patientsView"><div class="toolbar"><input id="patientSearch" placeholder="Search patient ID, name or phone"></div><div class="patient-grid" id="patientGrid"></div></section><section class="panel hidden" id="staffView"><div class="toolbar"><button id="addStaffBtn">+ Add staff account</button></div><div class="patient-grid" id="staffGrid"></div></section></main><dialog id="patientDialog"><form method="dialog" id="patientForm"><h2>Patient record</h2><input type="hidden" name="id"><div class="dialog-grid"><label>First name<input name="firstName" required></label><label>Last name<input name="lastName" required></label><label>Date of birth<input type="date" name="dateOfBirth"></label><label>Gender<select name="gender"><option value="">Select</option><option>Female</option><option>Male</option><option>Other</option></select></label><label>Phone<input name="phone" required></label><label>Email<input type="email" name="email"></label><label>Clinic<select name="branch"><option>Ebène</option><option>Port Louis</option></select></label><label>Preferred language<select name="preferredLanguage"><option>English</option><option>French</option><option>Chinese</option></select></label></div><label>Allergies<textarea name="allergies"></textarea></label><label>Medical history<textarea name="medicalHistory"></textarea></label><label>Current medication<textarea name="medication"></textarea></label><div class="dialog-actions"><button value="cancel">Cancel</button><button id="savePatientBtn" value="default">Save patient</button></div></form></dialog><script type="module" src="assets/js/portal.js"></script></body></html>
